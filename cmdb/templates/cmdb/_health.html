{% load le %}{% if state == "healthy" %}<span class="badge ok" title="{{ title|default:'Linked checks healthy' }}">{% ficon "check-circle" 14 %}Healthy</span>{% elif state == "warning" %}<span class="badge warn" title="{{ title|default:'A linked check is degraded' }}">{% ficon "alert" 14 %}Warning</span>{% elif state == "critical" %}<span class="badge crit" title="{{ title|default:'A linked check is down' }}">{% ficon "x-circle" 14 %}Critical</span>{% else %}<span class="badge mute" title="{{ title|default:'No linked checks with data' }}">{% ficon "help" 14 %}Unknown</span>{% endif %}
