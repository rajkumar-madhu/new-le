# TEMPLATE ONLY: placeholders, no real values. Not part of kustomization.yaml on purpose.
#
#   cp deploy/kubernetes/secret.template.yaml linkedeye-secrets.yaml   # outside the repository
#   edit the values, then:  kubectl apply -f linkedeye-secrets.yaml && rm linkedeye-secrets.yaml
#
# or create it directly (preferred: nothing on disk):
#   kubectl -n fs-linkedeye create secret generic linkedeye-secrets \
#     --from-literal=LINKEDEYE_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
#     --from-literal=LINKEDEYE_DB_PASSWORD='...' \
#     --from-literal=LINKEDEYE_ALERTMANAGER_WEBHOOK_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
#
# With Sealed Secrets / External Secrets / Vault, produce a Secret with this name and these keys.
# Remove the optional keys you do not use: a key that is present enables its integration with that value.
apiVersion: v1
kind: Secret
metadata:
  name: linkedeye-secrets
  namespace: fs-linkedeye
  labels:
    app.kubernetes.io/name: linkedeye
    app.kubernetes.io/part-of: linkedeye
type: Opaque
stringData:
  # required
  LINKEDEYE_SECRET_KEY: "<REPLACE: 50+ random characters>"
  LINKEDEYE_DB_PASSWORD: "<REPLACE: database password for LINKEDEYE_DB_USER>"
  # optional
  LINKEDEYE_ALERTMANAGER_WEBHOOK_TOKEN: "<REPLACE: bearer token Alertmanager sends, or remove this key>"
  LINKEDEYE_LOG_INGEST_TOKEN: "<REPLACE: bearer token for POST /api/v1/logs/, or remove this key>"
  LINKEDEYE_STACKSTORM_API_KEY: "<REPLACE: StackStorm API key, or remove this key>"
  LINKEDEYE_EMAIL_HOST_PASSWORD: "<REPLACE: SMTP password, or remove this key>"
  LINKEDEYE_NOTIFY_WEBHOOK_URLS: "<REPLACE: comma-separated webhook URLs (they often embed tokens), or remove this key>"
  LINKEDEYE_NAGIOS_PASSWORD: "<REPLACE: Nagios CGI password, or remove this key>"
