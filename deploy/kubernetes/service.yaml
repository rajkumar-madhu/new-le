apiVersion: v1
kind: Service
metadata:
  name: linkedeye-web
  namespace: fs-linkedeye
  labels:
    app.kubernetes.io/name: linkedeye
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: linkedeye
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: linkedeye
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
